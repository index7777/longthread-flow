<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LongThread Flow Privacy Policy</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f7f8fa;--surface:#fff;--text:#171717;--muted:#686868;--line:#e7e7e7;--accent:#111827}
    @media (prefers-color-scheme:dark){:root{--bg:#111214;--surface:#191b1f;--text:#f5f5f5;--muted:#a8abb2;--line:#2d3036;--accent:#fff}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.7}main{max-width:860px;margin:0 auto;padding:56px 24px 80px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:36px;box-shadow:0 8px 30px rgba(0,0,0,.04)}header{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:28px}.brand{font-size:14px;font-weight:700;letter-spacing:.02em}.lang{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:8px 10px}h1{font-size:34px;line-height:1.18;margin:8px 0 8px}h2{font-size:18px;margin:30px 0 8px}p{margin:0;color:var(--text)}.muted{color:var(--muted);font-size:14px}.notice{margin:24px 0;padding:16px 18px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}a{color:inherit}footer{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}@media(max-width:600px){main{padding:24px 14px 48px}.card{padding:24px 20px;border-radius:14px}header{flex-direction:column}h1{font-size:28px}}
  </style>
</head>
<body>
<main><article class="card">
  <header><div><div class="brand">LongThread Flow</div><h1 id="title"></h1><div class="muted" id="version"></div></div><select class="lang" id="lang" aria-label="Language"><option value="en">English</option><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="ja">日本語</option><option value="ko">한국어</option></select></header>
  <div class="notice" id="summary"></div>
  <section><h2 id="purposeTitle"></h2><p id="purpose"></p></section>
  <section><h2 id="accessTitle"></h2><p id="access"></p></section>
  <section><h2 id="storageTitle"></h2><p id="storage"></p></section>
  <section><h2 id="noAccessTitle"></h2><p id="noAccess"></p></section>
  <section><h2 id="permissionsTitle"></h2><p id="permissions"></p></section>
  <section><h2 id="deletionTitle"></h2><p id="deletion"></p></section>
  <section><h2 id="relationshipTitle"></h2><p id="relationship"></p></section>
  <section><h2 id="contactTitle"></h2><p id="contact"></p></section>
  <footer id="footer"></footer>
</article></main>
<script>
const T={
'en':{title:'Privacy Policy',version:'Effective date: August 21, 2026',summary:'LongThread Flow processes conversation-page information locally in your browser. It does not send conversation content to a developer server and does not call the OpenAI API.',purposeTitle:'Purpose',purpose:'LongThread Flow runs only on chatgpt.com to reduce rendering load in very long conversations, measure current-tab performance, and—only after you enable Guarded Auto Handoff—detect a safe time to move work into a new conversation.',accessTitle:'Data accessed',access:'The extension locally reads message content and page UI state to identify message nodes, generation state, unsent drafts, A/B comparison state, and to create and validate handoff checkpoints.',storageTitle:'Storage and transmission',storage:'Conversation content is not sent to a developer server or third party. Performance samples remain in current-tab memory. Settings are stored with chrome.storage.local. Guarded Auto Handoff checkpoints are stored locally only during migration and deleted after a successful handoff.',noAccessTitle:'Data not accessed',noAccess:'The extension does not intentionally read or store passwords, cookies, authentication tokens, or payment information, and it does not call the OpenAI API.',permissionsTitle:'Permissions',permissions:'storage is used for local settings and temporary migration state. Access to https://chatgpt.com/* is used only to run long-conversation optimization and handoff detection on that site.',deletionTitle:'Data deletion',deletion:'Removing the extension causes Chrome to clear extension local storage. A migration checkpoint is automatically deleted after a successful handoff.',relationshipTitle:'Third-party relationship',relationship:'LongThread Flow is an independent extension. It is not an OpenAI product and does not claim OpenAI certification or endorsement.',contactTitle:'Contact',contact:'For privacy questions, please use the public GitHub repository Issues page until a dedicated support email is published.',footer:'This policy may be updated when LongThread Flow features or data practices change.'},
'zh-TW':{title:'隱私政策',version:'生效日期：2026 年 8 月 21 日',summary:'LongThread Flow 僅在你的瀏覽器本機處理對話頁面資訊，不會把對話內容傳送到開發者伺服器，也不會呼叫 OpenAI API。',purposeTitle:'資料處理目的',purpose:'LongThread Flow 僅在 chatgpt.com 上運作，用於降低超長對話的瀏覽器渲染負擔、量測目前分頁效能，以及在你主動啟用 Guarded Auto Handoff 後判斷安全交接時機。',accessTitle:'會存取的資料',access:'擴充功能會在本機讀取目前對話頁面的訊息內容與介面狀態，以辨識訊息節點、生成狀態、尚未送出的草稿、A/B 比較狀態，以及產生與驗證 handoff checkpoint。',storageTitle:'儲存與傳輸',storage:'對話內容不會傳送到開發者伺服器或第三方。效能樣本只存在目前分頁記憶體。設定使用 chrome.storage.local 儲存。Guarded Auto Handoff checkpoint 只在 migration 過程中本機暫存，成功接手後即刪除。',noAccessTitle:'不會存取的資料',noAccess:'擴充功能不主動讀取或保存登入密碼、Cookie、驗證權杖或付款資料，也不呼叫 OpenAI API。',permissionsTitle:'權限',permissions:'storage 用於保存本機設定與短暫 migration 狀態。https://chatgpt.com/* 權限僅用於在該網站執行長對話優化與 handoff 判斷。',deletionTitle:'資料刪除',deletion:'移除擴充功能後，Chrome 會清除擴充功能的本機儲存。每次 migration 成功後，該次 checkpoint 會自動刪除。',relationshipTitle:'第三方關係',relationship:'LongThread Flow 是獨立擴充功能，並非 OpenAI 官方產品，也不聲稱獲 OpenAI 認證或背書。',contactTitle:'聯絡方式',contact:'如有隱私相關問題，在正式支援信箱公布前，請使用公開 GitHub repository 的 Issues 頁面聯絡。',footer:'若 LongThread Flow 的功能或資料處理方式改變，本政策可能同步更新。'},
'zh-CN':{title:'隐私政策',version:'生效日期：2026 年 8 月 21 日',summary:'LongThread Flow 仅在你的浏览器本地处理对话页面信息，不会将对话内容发送到开发者服务器，也不会调用 OpenAI API。',purposeTitle:'数据处理目的',purpose:'LongThread Flow 仅在 chatgpt.com 上运行，用于降低超长对话的浏览器渲染负担、测量当前标签页性能，以及在你主动启用 Guarded Auto Handoff 后判断安全交接时机。',accessTitle:'会访问的数据',access:'扩展程序会在本地读取当前对话页面的消息内容与界面状态，用于识别消息节点、生成状态、未发送草稿、A/B 比较状态，以及创建和验证 handoff checkpoint。',storageTitle:'存储与传输',storage:'对话内容不会发送到开发者服务器或第三方。性能样本仅保留在当前标签页内存中。设置使用 chrome.storage.local 保存。Guarded Auto Handoff checkpoint 仅在迁移期间本地暂存，成功交接后即删除。',noAccessTitle:'不会访问的数据',noAccess:'扩展程序不会主动读取或保存登录密码、Cookie、认证令牌或付款信息，也不会调用 OpenAI API。',permissionsTitle:'权限',permissions:'storage 用于保存本地设置与临时迁移状态。https://chatgpt.com/* 权限仅用于在该网站执行长对话优化与 handoff 判断。',deletionTitle:'数据删除',deletion:'移除扩展程序后，Chrome 会清除扩展程序的本地存储。每次迁移成功后，该次 checkpoint 会自动删除。',relationshipTitle:'第三方关系',relationship:'LongThread Flow 是独立扩展程序，并非 OpenAI 官方产品，也不声称获得 OpenAI 认证或背书。',contactTitle:'联系方式',contact:'如有隐私相关问题，在正式支持邮箱公布前，请使用公开 GitHub 仓库的 Issues 页面联系。',footer:'若 LongThread Flow 的功能或数据处理方式发生变化，本政策可能同步更新。'},
'ja':{title:'プライバシーポリシー',version:'施行日：2026年8月21日',summary:'LongThread Flow は会話ページの情報をブラウザ内でローカル処理します。会話内容を開発者サーバーへ送信せず、OpenAI API も呼び出しません。',purposeTitle:'目的',purpose:'LongThread Flow は chatgpt.com 上でのみ動作し、非常に長い会話の描画負荷を軽減し、現在のタブの性能を測定します。Guarded Auto Handoff をユーザーが有効にした場合のみ、安全な引き継ぎタイミングを判定します。',accessTitle:'アクセスするデータ',access:'拡張機能は、メッセージ要素、生成状態、未送信の下書き、A/B 比較状態を判定し、handoff checkpoint を作成・検証するために、現在の会話ページのメッセージ内容と UI 状態をローカルで読み取ります。',storageTitle:'保存と送信',storage:'会話内容は開発者サーバーや第三者へ送信されません。性能サンプルは現在のタブのメモリ内にのみ保持されます。設定は chrome.storage.local に保存されます。Guarded Auto Handoff の checkpoint は移行中のみローカル保存され、引き継ぎ成功後に削除されます。',noAccessTitle:'アクセスしないデータ',noAccess:'パスワード、Cookie、認証トークン、支払い情報を意図的に読み取り・保存せず、OpenAI API も呼び出しません。',permissionsTitle:'権限',permissions:'storage はローカル設定と一時的な移行状態の保存に使用します。https://chatgpt.com/* へのアクセスは、そのサイト上で長い会話の最適化と handoff 判定を行うためだけに使用します。',deletionTitle:'データ削除',deletion:'拡張機能を削除すると、Chrome が拡張機能のローカルストレージを消去します。移行成功後、checkpoint は自動的に削除されます。',relationshipTitle:'第三者との関係',relationship:'LongThread Flow は独立した拡張機能であり、OpenAI の製品ではなく、OpenAI の認定・推奨を主張しません。',contactTitle:'お問い合わせ',contact:'プライバシーに関するお問い合わせは、専用サポートメールが公開されるまで、公開 GitHub リポジトリの Issues をご利用ください。',footer:'LongThread Flow の機能またはデータ処理方法が変更された場合、本ポリシーも更新されることがあります。'},
'ko':{title:'개인정보 처리방침',version:'시행일: 2026년 8월 21일',summary:'LongThread Flow는 대화 페이지 정보를 브라우저 안에서 로컬로 처리합니다. 대화 내용을 개발자 서버로 전송하지 않으며 OpenAI API를 호출하지 않습니다.',purposeTitle:'목적',purpose:'LongThread Flow는 chatgpt.com에서만 동작하며 매우 긴 대화의 렌더링 부하를 줄이고 현재 탭의 성능을 측정합니다. 사용자가 Guarded Auto Handoff를 활성화한 경우에만 안전한 인계 시점을 판단합니다.',accessTitle:'접근하는 데이터',access:'확장 프로그램은 메시지 노드, 생성 상태, 전송되지 않은 초안, A/B 비교 상태를 식별하고 handoff checkpoint를 생성·검증하기 위해 현재 대화 페이지의 메시지 내용과 UI 상태를 로컬로 읽습니다.',storageTitle:'저장 및 전송',storage:'대화 내용은 개발자 서버나 제3자에게 전송되지 않습니다. 성능 샘플은 현재 탭 메모리에만 남습니다. 설정은 chrome.storage.local에 저장됩니다. Guarded Auto Handoff checkpoint는 마이그레이션 중에만 로컬로 저장되며 성공적으로 인계된 후 삭제됩니다.',noAccessTitle:'접근하지 않는 데이터',noAccess:'비밀번호, Cookie, 인증 토큰 또는 결제 정보를 의도적으로 읽거나 저장하지 않으며 OpenAI API를 호출하지 않습니다.',permissionsTitle:'권한',permissions:'storage는 로컬 설정과 임시 마이그레이션 상태를 저장하는 데 사용됩니다. https://chatgpt.com/* 접근 권한은 해당 사이트에서 긴 대화 최적화와 handoff 판단을 실행하는 데만 사용됩니다.',deletionTitle:'데이터 삭제',deletion:'확장 프로그램을 제거하면 Chrome이 확장 프로그램의 로컬 저장소를 삭제합니다. 마이그레이션이 성공하면 해당 checkpoint도 자동으로 삭제됩니다.',relationshipTitle:'제3자 관계',relationship:'LongThread Flow는 독립적인 확장 프로그램이며 OpenAI 제품이 아니고 OpenAI의 인증 또는 보증을 주장하지 않습니다.',contactTitle:'문의',contact:'개인정보 관련 문의는 전용 지원 이메일이 공개되기 전까지 공개 GitHub 저장소의 Issues 페이지를 이용해 주세요.',footer:'LongThread Flow의 기능 또는 데이터 처리 방식이 변경되면 본 정책도 업데이트될 수 있습니다.'}}
const ids=['title','version','summary','purposeTitle','purpose','accessTitle','access','storageTitle','storage','noAccessTitle','noAccess','permissionsTitle','permissions','deletionTitle','deletion','relationshipTitle','relationship','contactTitle','contact','footer'];
const select=document.getElementById('lang');
function detect(){const n=(navigator.language||'en').toLowerCase();if(n.startsWith('zh-tw')||n.startsWith('zh-hk'))return'zh-TW';if(n.startsWith('zh'))return'zh-CN';if(n.startsWith('ja'))return'ja';if(n.startsWith('ko'))return'ko';return'en'}
function render(lang){const d=T[lang]||T.en;document.documentElement.lang=lang;select.value=lang;ids.forEach(id=>document.getElementById(id).textContent=d[id]);localStorage.setItem('ltf-lang',lang)}
select.addEventListener('change',e=>render(e.target.value));render(localStorage.getItem('ltf-lang')||detect());
</script>
</body></html>
